<svg width="100%" height="130" viewBox="0 0 1200 130" xmlns="http://www.w3.org/2000/svg">

  <!-- Segment 1: INPUT to op-amp input (wire) -->
  <line x1="20" y1="50" x2="140" y2="50" stroke="#b87333" stroke-width="2.5"/>

  <!-- Op-amp stage 1 (gain block) - BLUE -->
  <polygon points="140,25 140,75 215,50" fill="none" stroke="#2D7DD2" stroke-width="2.5"/>
  <text x="120" y="38" font-family="monospace" font-size="13" fill="#2D7DD2">+</text>
  <text x="120" y="65" font-family="monospace" font-size="13" fill="#2D7DD2">−</text>

  <!-- Segment 2: op-amp output to resistor start (wire) -->
  <line x1="215" y1="50" x2="350" y2="50" stroke="#b87333" stroke-width="2.5"/>

  <!-- Resistor - AMBER/GOLD -->
  <polyline points="350,50 360,35 374,65 388,35 402,65 416,35 430,50"
            fill="none" stroke="#FFB300" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Segment 3: resistor end, through capacitor tee, to buffer input (wire) -->
  <line x1="430" y1="50" x2="750" y2="50" stroke="#b87333" stroke-width="2.5"/>

  <!-- Lead wire down to capacitor (wire) -->
  <line x1="530" y1="50" x2="530" y2="78" stroke="#b87333" stroke-width="2"/>

  <!-- Capacitor plates - CYAN -->
  <line x1="512" y1="80" x2="548" y2="80" stroke="#00BCD4" stroke-width="3"/>
  <line x1="512" y1="88" x2="548" y2="88" stroke="#00BCD4" stroke-width="3"/>

  <!-- Lead wire down to ground symbol (wire) -->
  <line x1="530" y1="88" x2="530" y2="98" stroke="#b87333" stroke-width="2"/>

  <!-- Ground symbol - SILVER/GRAY -->
  <line x1="518" y1="100" x2="542" y2="100" stroke="#CFD8DC" stroke-width="2"/>
  <line x1="522" y1="106" x2="538" y2="106" stroke="#CFD8DC" stroke-width="2"/>
  <line x1="526" y1="112" x2="534" y2="112" stroke="#CFD8DC" stroke-width="2"/>

  <!-- Buffer stage (output amplifier) - BLUE -->
  <polygon points="750,25 750,75 825,50" fill="none" stroke="#2D7DD2" stroke-width="2.5"/>

  <!-- Segment 4: buffer output to OUTPUT (wire) -->
  <line x1="825" y1="50" x2="1180" y2="50" stroke="#b87333" stroke-width="2.5"/>

  <!-- Labels -->
  <text x="20" y="15" font-family="monospace" font-size="14" fill="#b87333">INPUT</text>
  <text x="177" y="15" font-family="monospace" font-size="13" fill="#2D7DD2" text-anchor="middle">A1</text>
  <text x="390" y="28" font-family="monospace" font-size="13" fill="#FFB300" text-anchor="middle">R</text>
  <text x="530" y="128" font-family="monospace" font-size="13" fill="#00BCD4" text-anchor="middle">C</text>
  <text x="787" y="15" font-family="monospace" font-size="13" fill="#2D7DD2" text-anchor="middle">BUFFER</text>
  <text x="1180" y="15" font-family="monospace" font-size="14" fill="#b87333" text-anchor="end">OUTPUT</text>

  <!-- traveling signal pulse - GREEN -->
  <circle cy="50" r="6" fill="#39ff88">
    <animate attributeName="cx" values="20;1180" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cy="50" r="11" fill="#39ff88" opacity="0.25">
    <animate attributeName="cx" values="20;1180" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.25;0.25;0" keyTimes="0;0.05;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
